__meta__:
  name: "sordino_recon"
  version: "0.1.0"
  description: "Parameter mapping for SORDINO reconstruction."
  category: "recon_spec"
  transforms_source: "./utils.py"

SliceOrientation:
  sources:
    - file: method
      key: PVM_SPackArrSliceOrient
  transform: first

ReadoutOrientation:
  sources:
    - file: method
      key: PVM_SPackArrReadOrient
  transform: first

GradientOrientation:
  sources:
    - file: method
      key: PVM_SPackArrGradOrient
  transform: squeeze_ndarray

EncNReceivers:
  sources:
    - file: method
      key: PVM_EncNReceivers
  transform: first_int

NPoints:
  sources:
    - file: method
      key: NPoints
  transform: first_int

NPro:
  sources:
    - file: method
      key: NPro
  transform: first_int

RepetitionTime_ms:
  sources:
    - file: method
      key: RepetitionTime
    - file: method
      key: PVM_RepetitionTime
  transform: first_float

EffBandwidth_Hz:
  sources:
    - file: method
      key: PVM_EffSWh
  transform: first_float

OverSampling:
  sources:
    - file: method
      key: OverSampling
  transform: first_float

AcqDelayTotal_us:
  sources:
    - file: method
      key: AcqDelayTotal
  transform: first_float

NRepetitions:
  sources:
    - file: method
      key: PVM_NRepetitions
  transform: first_int

Matrix:
  sources:
    - file: method
      key: PVM_Matrix

UnderSampling:
  sources:
    - file: method
      key: ProUnderSampling
  transform: first_float

HalfAcquisition:
  sources:
    - file: method
      key: HalfAcquisition
  transform: to_bool

UseOrigin:
  sources:
    - file: method
      key: UseOrigin
  transform: to_bool

Reorder:
  sources:
    - file: method
      key: Reorder
  transform: to_bool

# --- ramp-time and phase correction (timing.py, WI-0056) ---------------
# Optional: missing keys give None (general ZTE has no RampTime).

RampTime_ms:
  sources:
    - file: method
      key: RampTime
  transform: first_float

RampDelay_ms:
  sources:
    - file: method
      key: RampDelay
  transform: first_float

RFWait_ms:
  sources:
    - file: method
      key: RFWait
  transform: first_float

MaximizeRampTime:
  sources:
    - file: method
      key: MaximizeRampTime

TrigSegmentMode:
  sources:
    - file: method
      key: TrigSegmentMode

ExcPulLength_ms:
  sources:
    - file: method
      key: ExcPul
  transform: first_float

O1List_Hz:
  sources:
    - file: acqp
      key: ACQ_O1_list
  transform: convert_to_list

# --- trajectory mode (golden.py, WI-0113) -------------------------------
# Read from the method; missing keys give None (older sequences: Default).

TrajectoryMode:
  sources:
    - file: method
      key: TrajectoryMode
  transform: strip_bruker_string

NGoldenSubsets:
  sources:
    - file: method
      key: NGoldenSubsets
  transform: first_int

NGoldenSpokesPerSubset:
  sources:
    - file: method
      key: NGoldenSpokesPerSubset
  transform: first_int

NGoldenSteps:
  sources:
    - file: method
      key: NGoldenSteps
  transform: first_int

GoldenReorder:
  sources:
    - file: method
      key: GoldenReorder
  transform: yes_no

ZStackAngleDeg:
  sources:
    - file: method
      key: ZStackAngleDeg
  transform: first_float

NGridRing:
  sources:
    - file: method
      key: NGridRing
  transform: first_int

NGridFrames:
  sources:
    - file: method
      key: NGridFrames
  transform: first_int

GridMirror:
  sources:
    - file: method
      key: GridMirror
  transform: yes_no
